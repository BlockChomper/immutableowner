[package]
name = "immutableowner"
version = "0.1.0"
description = "Immutable Owner and Non-Transferable Token Extension"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "immutableowner"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["token_2022", "associated_token"] }
spl-token-2022 = { version = "9.0.0", features = ["no-entrypoint"] }

# Instead of using spl-token-2022 directly, use it through anchor-spl
# to avoid version conflicts with solana-program

